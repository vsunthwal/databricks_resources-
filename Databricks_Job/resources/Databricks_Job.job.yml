bundle:
  name: my_databricks_bundle

resources:
  clusters:
    my_all_purpose_cluster:
      cluster_name: "My Interactive Cluster"
      spark_version: "15.4.x-scala2.12"
      
      node_type_id: "Standard_D3_v2"
      num_workers: 2
      autotermination_minutes: 60
      enable_elastic_disk: true
      runtime_engine: "STANDARD"
      policy_id: ""  # Optional: Apply a cluster policy if needed

  files:
    my_notebook:
      source: ../src/notebook.ipynb  # Path to your local notebook
      path: /Workspace/Users/my_user/notebook.ipynb  # Target path in Databricks workspace

  jobs:
    Databricks_Job:
      name: "Databricks_Job"

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - plahari@microsoft.com

      tasks:
        - task_key: "notebook_task"
          existing_cluster_id: ${resources.clusters.my_all_purpose_cluster}  # Attach to All-Purpose Compute
          notebook_task:
            notebook_path: "/Workspace/Users/my_user/notebook.ipynb"

