# The main job for Databricks_TableCreation.
resources:
  jobs:
    Databricks_TableCreation_job:
      name: Databricks_TableCreation_job

      trigger:
        # Run this job every day, exactly one day from the last run.
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - plahari@microsoft.com

      tasks:
        - task_key: notebook_task
          job_cluster_key: job_cluster
          notebook_task:
              notebook_path: ./src/notebook.ipynb

        
      job_clusters:
        job_cluster:
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_D3_v2"
            autoscale:
              min_workers: 1
              max_workers: 4
