# This is a Databricks asset bundle definition for Databricks_Cluster.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Databricks_Cluster
  uuid: 535b6b4f-7ff8-4310-a452-972ff15f8db1

include:
  - resources/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-1231335714174499.19.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://adb-1231335714174499.19.azuredatabricks.net
      # We explicitly specify /Workspace/Users/plahari@microsoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/plahari@microsoft.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: plahari@microsoft.com
        level: CAN_MANAGE
    run_as:
      user_name: plahari@microsoft.com
